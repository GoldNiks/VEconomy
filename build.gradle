plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = 'com.valorcraft.economy'

base {
    archivesName = 'VEconomy-1.20.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                economy_core {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                economy_core {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // SQLite (dev/тесты и локальный режим) + MySQL (прод) с пулом соединений HikariCP.
    implementation('org.xerial:sqlite-jdbc:3.45.3.0') { transitive = false }
    jarJar('org.xerial:sqlite-jdbc:3.45.3.0') {
        jarJar.ranged(it, '[3.45.3.0,4.0.0)')
    }
    implementation('com.mysql:mysql-connector-j:8.4.0') { transitive = false }
    jarJar('com.mysql:mysql-connector-j:8.4.0') {
        jarJar.ranged(it, '[8.0.0,9.0.0)')
    }
    implementation('com.zaxxer:HikariCP:5.1.0') { transitive = false }
    jarJar('com.zaxxer:HikariCP:5.1.0') {
        jarJar.ranged(it, '[5.0.0,6.0.0)')
    }

    // Optional integrations (compile-only). Jars in libs/ (local flatDir) must be
    // named <artifact>-<version>.jar; they are NOT bundled into the final jar.
    compileOnly fg.deobf(group: 'local', name: 'ftb-quests', version: '2001.4.22')
    compileOnly fg.deobf(group: 'local', name: 'ftb-library', version: '2001.2.13')
    compileOnly fg.deobf(group: 'local', name: 'ftb-teams', version: '2001.3.2')
    compileOnly fg.deobf(group: 'local', name: 'architectury', version: '9.2.14')
    compileOnly fg.deobf(group: 'local', name: 'kubejs', version: '2001.6.5')
    compileOnly fg.deobf(group: 'local', name: 'rhino', version: '2001.2.3')
    compileOnly fg.deobf(group: 'local', name: 'luckperms', version: '5.4.102')
    compileOnly fg.deobf(group: 'local', name: 'ftb-ranks', version: '2001.1.7')

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'

    // Интеграционная проверка MySQL через Testcontainers. Выполняется ТОЛЬКО
    // в отдельном профиле gradle mysqlIntegrationTest (нужен рабочий Docker);
    // обычный test-набор эти классы пропускает (см. @EnabledIfSystemProperty).
    testImplementation 'org.testcontainers:testcontainers:1.19.8'
    testImplementation 'org.testcontainers:mysql:1.19.8'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.8'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
    }
}

// Отдельный интеграционный профиль MySQL: запускает только тесты *MySql*
// с включённым системным свойством veconomy.mysqlIntegration. Умолчательный
// сбор (обычный `test`/`clean test`) их пропускает — никакой имитации успеха.
tasks.register('mysqlIntegrationTest', Test) {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
    }
    systemProperty 'veconomy.mysqlIntegration', 'true'
    filter {
        includeTestsMatching '*MySql*'
    }
    jvmArgs '-Dveconomy.mysqlIntegration=true'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes([
                'Specification-Title'   : 'VEconomy',
                'Specification-Version' : project.version,
                'Specification-Vendor'  : 'ValorCraft',
                'Implementation-Title'  : 'VEconomy',
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': 'ValorCraft'
        ])
    }
}

// Финальный артефакт с упакованным SQLite-драйвером (jarJar):
// build/libs/VEconomy-1.20.1-<версия>-all.jar. ForgeGradle сам переобаскьюрирует
// его через reobfJarJar; его и нужно класть в папку mods сервера.
