plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = 'com.valorcraft.economy'

base {
    archivesName = 'VEconomy-1.20.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                economy_core {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                economy_core {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation('org.xerial:sqlite-jdbc:3.45.3.0') { transitive = false }
    jarJar('org.xerial:sqlite-jdbc:3.45.3.0') {
        jarJar.ranged(it, '[3.45.3.0,4.0.0)')
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes([
                'Specification-Title'   : 'VEconomy',
                'Specification-Version' : project.version,
                'Specification-Vendor'  : 'ValorCraft',
                'Implementation-Title'  : 'VEconomy',
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': 'ValorCraft'
        ])
    }
}

// Финальный артефакт с упакованным SQLite-драйвером (jarJar):
// build/libs/VEconomy-1.20.1-<версия>-all.jar. ForgeGradle сам переобаскьюрирует
// его через reobfJarJar; его и нужно класть в папку mods сервера.
